<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Proformas — Transporte de Personal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="tqs-app">

    <div class="tqs-header">
      <div>
        <h2 class="tqs-title">Sistema de proformas — Transporte de personal</h2>
        <div class="tqs-subtitle">Cotización de recorridos por turno y vuelta</div>
      </div>
      <button class="tqs-btn tqs-btn-sm" onclick="app.nuevaProforma()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12.0684 2.03418C12.5654 2.03421 12.9687 2.43755 12.9688 2.93457V11.0996H21.0654C21.5625 11.0996 21.9658 11.503 21.9658 12C21.9658 12.497 21.5625 12.9004 21.0654 12.9004H12.9688V21.0654C12.9687 21.5625 12.5654 21.9658 12.0684 21.9658C11.5713 21.9658 11.168 21.5625 11.168 21.0654V12.9004H2.93457C2.43752 12.9004 2.03418 12.497 2.03418 12C2.03418 11.503 2.43752 11.0996 2.93457 11.0996H11.168V2.93457C11.168 2.43752 11.5713 2.03418 12.0684 2.03418Z" fill="currentColor"/>
        </svg>
        Nueva proforma
      </button>
    </div>

    <div class="tqs-card">
      <div class="tqs-card-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12.0001 2.09961C17.4773 2.09961 21.9004 6.52269 21.9004 11.9999C21.9004 14.3773 21.0456 16.5587 19.6056 18.2613C19.3762 18.5417 19.042 18.7071 18.6837 18.7197L17.9728 18.7441C17.9357 18.7454 17.8986 18.7461 17.8615 18.7461H6.13873C6.10162 18.7461 6.06452 18.7454 6.02742 18.7441L5.31654 18.7197C4.95822 18.7071 4.62402 18.5417 4.39462 18.2613C2.95462 16.5587 2.09985 14.3773 2.09985 11.9999C2.09985 6.52269 6.52293 2.09961 12.0001 2.09961ZM12.0001 3.89961C7.51723 3.89961 3.89985 7.51699 3.89985 11.9999C3.89985 13.9251 4.57698 15.6895 5.72868 17.0996C5.73633 17.1091 5.74512 17.1174 5.75488 17.124C5.76465 17.1306 5.77539 17.1357 5.78662 17.1387L6.13873 17.1461H17.8615L18.2136 17.1387C18.2249 17.1357 18.2356 17.1306 18.2454 17.124C18.2551 17.1174 18.2639 17.1091 18.2715 17.0996C19.4232 15.6895 20.1004 13.9251 20.1004 11.9999C20.1004 7.51699 16.483 3.89961 12.0001 3.89961Z" fill="currentColor"/>
          <path d="M12.0001 5.09961C12.4972 5.09961 12.9001 5.50255 12.9001 5.99961V11.4854L15.8082 8.57731C16.1597 8.22584 16.7295 8.22584 17.081 8.57731C17.4325 8.92878 17.4325 9.49862 17.081 9.85009L12.6364 14.2947C12.2849 14.6462 11.7151 14.6462 11.3636 14.2947L6.91907 9.85009C6.5676 9.49862 6.5676 8.92878 6.91907 8.57731C7.27054 8.22584 7.84038 8.22584 8.19185 8.57731L11.1001 11.4854V5.99961C11.1001 5.50255 11.5031 5.09961 12.0001 5.09961Z" fill="currentColor"/>
        </svg>
        Datos del cliente y tarifa
      </div>
      <div class="tqs-row">
        <div class="tqs-field" style="flex:2;">
          <label>Cliente</label>
          <select id="cliente" onchange="app.updateCliente()">
            <option value="McDonald's">McDonald's</option>
            <option value="Pizza Hut">Pizza Hut</option>
            <option value="Burger King">Burger King</option>
            <option value="Walmart">Walmart</option>
            <option value="Otro">Otro...</option>
          </select>
        </div>
        <div class="tqs-field" id="custom-cliente-field" style="display:none;flex:2;">
          <label>Nombre del cliente</label>
          <input type="text" id="custom-cliente" placeholder="Ej. Pollo Campero" oninput="app.updateCliente()">
        </div>
        <div class="tqs-field" style="min-width:100px;">
          <label>Tarifa vuelta única</label>
          <div class="tqs-toggle">
            <button class="active" data-val="35" onclick="app.setTarifa(35)">$35</button>
            <button data-val="40" onclick="app.setTarifa(40)">$40</button>
          </div>
        </div>
      </div>
    </div>

    <div class="tqs-card">
      <div class="tqs-card-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M4.10001 5.99998C4.10001 5.50292 4.50295 5.09998 5.00001 5.09998H19C19.4971 5.09998 19.9 5.50292 19.9 5.99998C19.9 6.49703 19.4971 6.89998 19 6.89998H5.00001C4.50295 6.89998 4.10001 6.49703 4.10001 5.99998ZM4.10001 12C4.10001 11.5029 4.50295 11.1 5.00001 11.1H19C19.4971 11.1 19.9 11.5029 19.9 12C19.9 12.497 19.4971 12.9 19 12.9H5.00001C4.50295 12.9 4.10001 12.497 4.10001 12ZM4.10001 18C4.10001 17.5029 4.50295 17.1 5.00001 17.1H19C19.4971 17.1 19.9 17.5029 19.9 18C19.9 18.497 19.4971 18.9 19 18.9H5.00001C4.50295 18.9 4.10001 18.497 4.10001 18Z" fill="currentColor"/>
        </svg>
        Turnos de salida
      </div>
      <div id="turnos-list"></div>
      <div id="turnos-empty" class="tqs-empty">No hay turnos registrados. Agrega el primero.</div>
      <button class="tqs-btn" onclick="app.addTurno()" style="margin-top:8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12.0684 2.03418C12.5654 2.03421 12.9687 2.43755 12.9688 2.93457V11.0996H21.0654C21.5625 11.0996 21.9658 11.503 21.9658 12C21.9658 12.497 21.5625 12.9004 21.0654 12.9004H12.9688V21.0654C12.9687 21.5625 12.5654 21.9658 12.0684 21.9658C11.5713 21.9658 11.168 21.5625 11.168 21.0654V12.9004H2.93457C2.43752 12.9004 2.03418 12.497 2.03418 12C2.03418 11.503 2.43752 11.0996 2.93457 11.0996H11.168V2.93457C11.168 2.43752 11.5713 2.03418 12.0684 2.03418Z" fill="currentColor"/>
        </svg>
        Agregar turno
      </button>
    </div>

    <div class="tqs-card tqs-resumen">
      <div class="tqs-card-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15.4795 15.4971C15.9765 15.4971 16.3799 15.9004 16.3799 16.3975C16.3799 16.8945 15.9765 17.2978 15.4795 17.2979H8.52051C8.02345 17.2979 7.62012 16.8945 7.62012 16.3975C7.62012 15.9004 8.02345 15.4971 8.52051 15.4971H15.4795ZM15.4795 11.6982C15.9765 11.6982 16.3799 12.1016 16.3799 12.5986C16.3799 13.0957 15.9765 13.499 15.4795 13.499H8.52051C8.02345 13.499 7.62012 13.0957 7.62012 12.5986C7.62012 12.1016 8.02345 11.6982 8.52051 11.6982H15.4795ZM17.2335 4.16016C16.51 3.47933 15.5539 3.09968 14.5605 3.09961H8.90039C6.74649 3.09961 5 4.84609 5 7.00001V17C5 19.1539 6.74649 20.9004 8.90039 20.9004H17C19.1539 20.9004 20.9004 19.1539 20.9004 17V9.2959C20.9003 8.22067 20.4558 7.19299 19.6729 6.45605L17.2335 4.16016ZM14.5605 4.89961C15.0728 4.89965 15.5637 5.09326 15.9346 5.43653L18.374 7.73242C18.7871 8.11475 19.0137 8.65626 19.0001 9.21973V17C19.0001 18.1598 18.1598 19.0001 17 19.0001H8.90039C7.74059 19.0001 6.90039 18.1598 6.90039 17V7.00001C6.90039 5.84021 7.74059 5 8.90039 5H14.5605Z" fill="currentColor"/>
        </svg>
        Resumen de proforma
      </div>
      <div id="resumen-body"></div>
    </div>

    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;">
      <button class="tqs-btn" onclick="app.copiarResumen()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M17 7.09961C19.1539 7.09961 20.9004 8.84609 20.9004 11V17C20.9004 19.1539 19.1539 20.9004 17 20.9004H11C8.84609 20.9004 7.09961 19.1539 7.09961 17V11C7.09961 8.84609 8.84609 7.09961 11 7.09961H17ZM11 8.89961C9.84021 8.89961 8.89961 9.84021 8.89961 11V17C8.89961 18.1598 9.84021 19.0996 11 19.0996H17C18.1598 19.0996 19.0996 18.1598 19.0996 17V11C19.0996 9.84021 18.1598 8.89961 17 8.89961H11ZM5.09961 5C5.09961 3.8402 6.0402 2.89961 7.2 2.89961H14C15.1598 2.89961 16.0996 3.8402 16.0996 5V5.90002C16.0996 6.39707 15.6967 6.80002 15.1996 6.80002C14.7026 6.80002 14.2996 6.39707 14.2996 5.90002V5C14.2996 4.83432 14.1657 4.70002 14 4.70002H7.2C7.03432 4.70002 6.89961 4.83432 6.89961 5V14.8C6.89961 14.9657 7.03432 15.1 7.2 15.1H8.09961C8.59666 15.1 8.99961 15.5029 8.99961 16C8.99961 16.4971 8.59666 16.9 8.09961 16.9H7.2C6.0402 16.9 5.09961 15.9594 5.09961 14.8V5Z" fill="currentColor"/>
        </svg>
        Copiar resumen
      </button>
      <button class="tqs-btn tqs-btn-primary" onclick="app.imprimir()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2.90002C12.4971 2.90002 12.9 3.30297 12.9 3.80002V12.2939L15.8081 9.38585C16.1595 9.03438 16.7294 9.03438 17.0808 9.38585C17.4323 9.73732 17.4323 10.3072 17.0808 10.6586L12.6364 15.1032C12.2849 15.4547 11.7151 15.4547 11.3636 15.1032L6.91907 10.6586C6.5676 10.3072 6.5676 9.73732 6.91907 9.38585C7.27054 9.03438 7.84038 9.03438 8.19185 9.38585L11.1 12.2939V3.80002C11.1 3.30297 11.503 2.90002 12 2.90002ZM4.09961 14.8C4.09961 14.3029 4.50255 13.9 4.99961 13.9H8.09961C8.59666 13.9 8.99961 14.3029 8.99961 14.8C8.99961 15.297 8.59666 15.7 8.09961 15.7H5.89961V19.1C5.89961 19.597 6.30255 20 6.79961 20H17.1996C17.6967 20 18.0996 19.597 18.0996 19.1V15.7H15.8996C15.4026 15.7 14.9996 15.297 14.9996 14.8C14.9996 14.3029 15.4026 13.9 15.8996 13.9H18.9996C19.4967 13.9 19.8996 14.3029 19.8996 14.8V19.1C19.8996 20.597 18.6966 21.8 17.1996 21.8H6.79961C5.30259 21.8 4.09961 20.597 4.09961 19.1V14.8Z" fill="currentColor"/>
        </svg>
        Imprimir / Exportar
      </button>
    </div>

    <div id="tqs-print-output" class="tqs-print-area"></div>

  </div>

  <script src="app.js"></script>
</body>
</html>
